<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModelDock · AI 研发工具配置与缓存率监控中心</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('modeldock_theme');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else if (window.matchMedia) {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-fg-1 antialiased selection:bg-indigo-500/30">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
